name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check formatting
        run: ./gradlew ktlintCheck

      - name: Build and test
        run: ./gradlew check
