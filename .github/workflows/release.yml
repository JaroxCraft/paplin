name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate tag matches gradle.properties
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PAPLIN_VER="${VERSION%%+*}"
          MC_VER="${VERSION##*+}"

          if ! echo "$PAPLIN_VER" | grep -qP '^\d+\.\d+\.\d+(-[\w.]+)?$'; then
            echo "::error::Invalid paplin version format: $PAPLIN_VER. Expected semver (e.g. 1.0.0 or 1.0.0-beta.1)"
            exit 1
          fi
          if ! echo "$MC_VER" | grep -qP '^\d+\.\d+\.\d+$'; then
            echo "::error::Invalid minecraft version format: $MC_VER. Expected semver (e.g. 26.1.2)"
            exit 1
          fi

          PROPS_PAPLIN=$(grep '^paplinVersion=' gradle.properties | cut -d= -f2)
          PROPS_MC=$(grep '^minecraft = ' gradle/libs.versions.toml | sed 's/.*"\([^"]*\)".*/\1/')

          echo "Tag:        v${PAPLIN_VER}+${MC_VER}"
          echo "Properties: ${PROPS_PAPLIN}+${PROPS_MC}"

          if [ "$PAPLIN_VER" != "$PROPS_PAPLIN" ] || [ "$MC_VER" != "$PROPS_MC" ]; then
            echo "::error::Tag version does not match project versions."
            echo "  Tag says:      ${PAPLIN_VER}+${MC_VER}"
            echo "  gradle.props:  ${PROPS_PAPLIN}"
            echo "  versions.toml: ${PROPS_MC}"
            echo "Bump versions first, then re-tag."
            exit 1
          fi

          echo "full=${VERSION}"         >> $GITHUB_OUTPUT
          echo "paplin=${PAPLIN_VER}"    >> $GITHUB_OUTPUT
          echo "minecraft=${MC_VER}"     >> $GITHUB_OUTPUT
          if echo "$PAPLIN_VER" | grep -q -- '-'; then
            echo "prerelease=true"       >> $GITHUB_OUTPUT
          else
            echo "prerelease=false"      >> $GITHUB_OUTPUT
          fi

      - name: Check and build
        run: ./gradlew check

      - name: Generate documentation
        run: ./gradlew clean dokkaGenerateHtml --no-configuration-cache --rerun-tasks

      - name: Verify docs exist
        run: ls -la build/dokka/html/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

      - name: Publish
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact on GitHub Packages
        run: |
          VERSION="${{ steps.version.outputs.full }}"
          URL="https://maven.pkg.github.com/JaroxCraft/paplin/de/jarox/paplin/${VERSION}/paplin-${VERSION}.pom"
          echo "Polling: $URL"
          for i in $(seq 1 12); do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Artifact confirmed after ${i} attempt(s)."
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting 5s"
            sleep 5
          done
          echo "::error::Artifact not found on GitHub Packages after 60 seconds."
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Paplin ${{ steps.version.outputs.paplin }} for Minecraft ${{ steps.version.outputs.minecraft }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          body: |
            **Artifact:** `de.jarox:paplin:${{ steps.version.outputs.full }}`
            **Repository:** `https://maven.pkg.github.com/JaroxCraft/paplin`

            ```kotlin
            // gradle/libs.versions.toml
            paplin = "${{ steps.version.outputs.paplin }}"
            minecraft = "${{ steps.version.outputs.minecraft }}"
            ```
